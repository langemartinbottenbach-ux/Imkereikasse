<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imkereikasse V5</title></head><body><h1>Imkereikasse V5</h1><p>Erweiterte Version mit kompletter Produktliste, Backup-Import und PWA-Vorbereitung.</p><script>
const products=[
'Raps-Honig 250g','Raps-Honig 500g','Sommer-flüssig 250g','Sommer-flüssig 500g','Sommer-cremig 250g','Sommer-cremig 500g','Obstblüte-cremig 250g','Obstblüte-cremig 500g','Akazie-flüssig 250g','Akazie-flüssig 500g','Kastanie-flüssig 250g','Handcreme','Körpercreme','Fußcreme','Propolino Lippenstift','Lippenbalsam','Gelee-Royal Creme klein','Gelee-Royal Creme groß','Propolis Honig Creme groß','Propolis Salbe Naturell klein','Propolis Salbe Naturell groß','Propolis Tinktur MIT Alkohol','Propolis Tinktur OHNE Alkohol','Seife fest mit Honig','Seife fest mit Propolis','Seife flüssig','Bonbons','Holz&Lederbalsam Bienenwachs','Bienenwachs','Eierlikör','Tannenbaum klein','Tannenbaum groß','Stumpfenkerze mit Stern','Stumpfenkerze mit Glocke','Zapfen-Kerze','Großer Stern','Engel','Rose','Geschenkkorb','Bienenkorb','Tischkerze gedreht gegossen','Gedrehte Kerze klein','Gedrehte Kerze mittel','Gedrehte Kerze groß','Gedrehte Tischkerze','Gerollte Kerze'];
function exportBackup(){const data={products,sales:JSON.parse(localStorage.getItem('v4_sales')||'[]')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='imkerei-backup.json';a.click();}
function importBackup(f){const r=new FileReader();r.onload=e=>{const d=JSON.parse(e.target.result);localStorage.setItem('v4_sales',JSON.stringify(d.sales||[]));alert('Backup importiert');};r.readAsText(f);}
if('serviceWorker' in navigator){console.log('PWA vorbereitet');}
</script></body></html>
