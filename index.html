<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐝 Imkereikasse 2.0</title>

<style>
:root{
  --primary:#1e293b;
  --success:#16a34a;
  --bg:#f4f1ea;
  --card:#ffffff;
  --border:#d6d6d6;
}

*{
  box-sizing:border-box;
  font-family:Segoe UI,Arial,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

header{
  background:var(--primary);
  color:white;
  padding:15px;
}

header h1{
  margin:0;
}

.container{
  display:flex;
  flex-wrap:wrap;
}

.products{
  flex:2;
  padding:15px;
}

.cart{
  flex:1;
  min-width:320px;
  background:white;
  padding:15px;
  border-left:1px solid var(--border);
}

h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;
}

.product{
  border:none;
  border-radius:10px;
  background:#fde68a;
  padding:15px;
  cursor:pointer;
  text-align:left;
  font-size:16px;
}

.product:hover{
  opacity:0.9;
}

.price{
  display:block;
  font-weight:bold;
  margin-top:6px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:8px 0;
}

.qty{
  display:flex;
  gap:4px;
}

.qty button{
  width:28px;
  height:28px;
}

.total{
  font-size:28px;
  font-weight:bold;
  margin-top:15px;
}

.checkout{
  width:100%;
  margin-top:15px;
  padding:15px;
  background:var(--success);
  color:white;
  border:none;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
}

.stats{
  margin-top:20px;
  background:#f8fafc;
  padding:10px;
  border-radius:10px;
}

@media(max-width:900px){
  .container{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
<h1>🐝 Imkereikasse 2.0</h1>
</header>

<div class="container">

<div class="products">

<h2>Favoriten</h2>

<div class="grid" id="productGrid"></div>

</div>

<div class="cart">

<h2>Aktuelle Rechnung</h2>

<div id="cartItems"></div>

<div class="total" id="total">
0,00 €
</div>

<button class="checkout" onclick="checkout()">
✅ BEZAHLT
</button>

<div class="stats">
<div><strong>Tagesumsatz:</strong> <span id="dailyRevenue">0,00 €</span></div>
<div><strong>Verkäufe:</strong> <span id="saleCount">0</span></div>
</div>

</div>

</div>

<script>

const defaultProducts = [

{
id:"h1",
name:"Raps-Honig 500g",
price:7.00
},

{
id:"h2",
name:"Sommer-Honig 500g",
price:8.00
},

{
id:"h3",
name:"Obstblüte 500g",
price:8.00
},

{
id:"i1",
name:"Handcreme",
price:6.00
},

{
id:"i2",
name:"Propolis Tinktur",
price:12.00
},

{
id:"i3",
name:"Bonbons",
price:2.50
},

{
id:"k1",
name:"Engel Kerze",
price:4.00
},

{
id:"k2",
name:"Bienenkorb Kerze",
price:4.00
}

];

let cart = [];

let sales =
JSON.parse(localStorage.getItem("imkerei_sales"))
|| [];

function euro(value){
  return value.toFixed(2).replace(".",",") + " €";
}

function renderProducts(){

const container =
document.getElementById("productGrid");

container.innerHTML = "";

defaultProducts.forEach(product=>{

const button =
document.createElement("button");

button.className="product";

button.innerHTML=
`
${product.name}
<span class="price">
${euro(product.price)}
</span>
`;

button.onclick=
()=>addToCart(product);

container.appendChild(button);

});

}

function addToCart(product){

const existing =
cart.find(x=>x.id===product.id);

if(existing){

existing.qty++;

}else{

cart.push({
...product,
qty:1
});

}

renderCart();

}

function changeQty(id, amount){

const item =
cart.find(x=>x.id===id);

if(!item) return;

item.qty += amount;

if(item.qty<=0){

cart =
cart.filter(x=>x.id!==id);

}

renderCart();

}

function renderCart(){

const container =
document.getElementById("cartItems");

container.innerHTML="";

let total=0;

cart.forEach(item=>{

total += item.price * item.qty;

const row =
document.createElement("div");

row.className="cart-item";

row.innerHTML=
`
<div>
<strong>${item.name}</strong><br>
${item.qty} x ${euro(item.price)}
</div>

<div class="qty">
<button onclick="changeQty('${item.id}',-1)">-</button>
<button onclick="changeQty('${item.id}',1)">+</button>
</div>
`;

container.appendChild(row);

});

document.getElementById("total").textContent =
euro(total);

}

function checkout(){

if(cart.length===0){

alert("Keine Artikel ausgewählt.");
return;

}

const total =
cart.reduce(
(sum,item)=>
sum + item.price * item.qty,
0
);

sales.push({

id:Date.now(),
date:new Date().toISOString(),
total:total,
items:[...cart]

});

localStorage.setItem(
"imkerei_sales",
JSON.stringify(sales)
);

cart=[];

renderCart();
updateStats();

alert(
"Verkauf gespeichert: "
+ euro(total)
);

}

function updateStats(){

const revenue =
sales.reduce(
(sum,sale)=>sum+sale.total,
0
);

document.getElementById(
"dailyRevenue"
).textContent = euro(revenue);

document.getElementById(
"saleCount"
).textContent = sales.length;

}

renderProducts();
renderCart();
updateStats();

</script>

</body>
</html>
