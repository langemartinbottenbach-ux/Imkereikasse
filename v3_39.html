<script>
const defaultProducts=[
{cat:'Honige',name:'Raps-Honig 250g',price:5,fav:false},{cat:'Honige',name:'Raps-Honig 500g',price:7,fav:true},{cat:'Honige',name:'Sommer-flüssig 250g',price:5,fav:false},{cat:'Honige',name:'Sommer-flüssig 500g',price:8,fav:true},{cat:'Honige',name:'Akazie-flüssig 250g',price:6,fav:false},{cat:'Honige',name:'Akazie-flüssig 500g',price:9,fav:true},{cat:'Honige',name:'Obstblüte-cremig 250g',price:5,fav:false},{cat:'Honige',name:'Obstblüte-cremig 500g',price:8,fav:true},{cat:'Honige',name:'Sommer-cremig 250g',price:5,fav:false},{cat:'Honige',name:'Sommer-cremig 500g',price:8,fav:false},{cat:'Honige',name:'Kastanie-flüssig 250g',price:6,fav:false},

{cat:'Imkergut',name:'Seife flüssig',price:6,fav:false},
{cat:'Imkergut',name:'Körpercreme',price:12,fav:false},  

{cat:'Imkergut',name:'Holz&Lederbalsam Bienenwachs',price:14,fav:false},
{cat:'Imkergut',name:'Bienenwachs',price:7,fav:false},

{cat:'Imkergut',name:'Roh-Propolis',price:25,fav:false},  
{cat:'Imkergut',name:'Eierlikör',price:12,fav:false},
  
{cat:'Kerzen',name:'Tannenbaum klein',price:7,fav:true},{cat:'Kerzen',name:'Tannenbaum groß',price:11,fav:true},{cat:'Kerzen',name:'Engel',price:4,fav:true},{cat:'Kerzen',name:'Bienenkorb',price:4,fav:false},{cat:'Kerzen',name:'Gerollte Kerze',price:5,fav:true},{cat:'Kerzen',name:'Rose',price:3,fav:false},{cat:'Kerzen',name:'Stumpfenkerze mit Stern',price:7,fav:false},{cat:'Kerzen',name:'Stumpfenkerze mit Glocke',price:11,fav:false},{cat:'Kerzen',name:'Zapfen-Kerze',price:7,fav:false},{cat:'Kerzen',name:'Großer Stern',price:12,fav:false},{cat:'Kerzen',name:'Geschenkkorb',price:3,fav:false},{cat:'Kerzen',name:'Tischkerze gedreht gegossen',price:4,fav:false},{cat:'Kerzen',name:'Gedrehte Kerze klein',price:3,fav:false},{cat:'Kerzen',name:'Gedrehte Kerze mittel',price:6,fav:false},{cat:'Kerzen',name:'Gedrehte Kerze groß',price:10,fav:false},{cat:'Kerzen',name:'Gedrehte Tischkerze',price:3,fav:false}
];

let products=JSON.parse(localStorage.getItem('products_v329')||'null');

if(!products){
products=JSON.parse(JSON.stringify(defaultProducts));
products.forEach((p,i)=>{p.id='P'+String(i+1).padStart(4,'0');});
localStorage.setItem('products_v329',JSON.stringify(products));
}

products.forEach((p,i)=>{
if(!p.id){
p.id='P'+String(i+1).padStart(4,'0');
saveProducts();
}
});

let cart=[];let expanded={};let sales=JSON.parse(localStorage.getItem('sales_v31')||'[]');let editingSale=null;let editProductIndex=null;

let activeSalesLocation=localStorage.getItem('activeSalesLocation')||'Keine Verkaufsstelle';

const euro=v=>v.toFixed(2).replace('.',',')+' €';

function getItemPrice(item){

if(item.isGift){
return 0;
}

if(item.discountType==='EURO'){
return Math.max(0,item.price-(item.discountValue||0));
}

if(item.discountType==='PERCENT'){
return item.price*(1-(item.discountValue||0)/100);
}

return item.price;

}

function saveProducts(){
localStorage.setItem('products_v329',JSON.stringify(products));
}function honeyButtonHtml(p){const is250=p.name.includes('250g');let label=p.name.replace(' 250g','').replace(' 500g','').replaceAll('-','<br>');return '<div class="honey-glass '+(is250?'small':'large')+'"><img src="'+(is250?'honig250.png':'honig500.png')+'"><div class="honey-label">'+label+'</div></div>';}

function render(){

const headerInfo=document.getElementById('salesLocationHeader');
if(headerInfo){
headerInfo.textContent=
activeSalesLocation==='ALLE'
? '🌍 Alle Verkaufsstellen'
: activeSalesLocation;}

if(document.getElementById('editInfo'))document.getElementById('editInfo').style.display=editingSale!==null?'block':'none';const el=document.getElementById('cats');el.innerHTML='';[['Honige','h'],['Imkergut','i'],['Kerzen','k']].forEach(([c,cl])=>{const box=document.createElement('div');box.className='cat';box.innerHTML='<h2>'+c+'</h2><div class="grid"></div>';const g=box.querySelector('.grid');products.filter(p=>p.cat===c&&p.fav&&p.active!==false).sort((a,b)=>(a.pos||999)-(b.pos||999)).forEach(p=>{const b=document.createElement('button');if(c==='Honige'){b.className='btn honey-btn';b.innerHTML=honeyButtonHtml(p);}else{b.className='btn '+cl;b.innerHTML='<b>'+p.name+'</b><br>'+euro(p.price);}b.onclick=()=>add(p);g.appendChild(b)});const other=products.filter(p=>p.cat===c&&!p.fav&&p.active!==false).sort((a,b)=>(a.pos||999)-(b.pos||999));if(other.length){const m=document.createElement('button');m.className='more';m.textContent=expanded[c]?'▲ Weitere Produkte':'▼ Weitere Produkte ('+other.length+')';m.onclick=()=>{expanded[c]=!expanded[c];render();};box.appendChild(m);if(expanded[c]){const hg=document.createElement('div');hg.className='grid';other.forEach(p=>{const b=document.createElement('button');if(c==='Honige'){b.className='btn honey-btn';b.innerHTML=honeyButtonHtml(p);}else{b.className='btn '+cl;b.innerHTML='<b>'+p.name+'</b><br>'+euro(p.price);}b.onclick=()=>add(p);hg.appendChild(b)});box.appendChild(hg);}}el.appendChild(box)});renderCart();stats();}
function getLastSaleIndex(){

for(let i=sales.length-1;i>=0;i--){

if(
!sales[i].storno &&
sales[i].salesLocation===activeSalesLocation
){
return i;
}

}

return -1;
}

function editLastSale(){

if(!sales.length)return alert('Kein Bon vorhanden');

editingSale=getLastSaleIndex();

if(editingSale===-1){
alert('Für diese Verkaufsstelle ist kein Bon vorhanden');
return;
}

cart=JSON.parse(JSON.stringify(sales[editingSale].items));

document.getElementById('editInfo').style.display='block';

renderCart();

}

function deleteLastSale(){

const index=getLastSaleIndex();

if(index===-1){

alert('Für diese Verkaufsstelle ist kein Bon vorhanden');

return;

}

sales[index].storno=true;

localStorage.setItem('sales_v31',JSON.stringify(sales));

alert(
'Der letzte Bon der Verkaufsstelle "' +
activeSalesLocation +
'" wurde storniert.'
);

stats();

render();

}

function add(p){

cart.push({

cartId:Date.now().toString()+Math.random().toString(36).substring(2),

id:p.id,
cat:p.cat,
name:p.name,
price:p.price,
fav:p.fav,
active:p.active,
pos:p.pos,

qty:1,

isGift:false,

discountType:null,
discountValue:0

});

renderCart();

}
function removeItem(cartId){

cart=cart.filter(x=>x.cartId!==cartId);

renderCart();

}

function toggleGift(cartId){

const item=cart.find(x=>x.cartId===cartId);

if(!item)return;



item.isGift=!item.isGift;

if(item.isGift){
item.discountType=null;
item.discountValue=0;
}

renderCart();

}

let discountItem=null;

function setDiscount(cartId){

discountItem=cart.find(x=>x.cartId===cartId);

if(!discountItem)return;

document.getElementById('discountEuro').value='';
document.getElementById('discountPercent').value='';

document.getElementById('discountModal').classList.add('open');

}

function closeDiscount(){

document.getElementById('discountModal').classList.remove('open');

discountItem=null;

}

function quickDiscount(value){

document.getElementById('discountEuro').value=value;
document.getElementById('discountPercent').value='';

}

function quickPercent(value){

document.getElementById('discountPercent').value=value;
document.getElementById('discountEuro').value='';

}

function saveDiscount(){

if(!discountItem)return;

let euro=document.getElementById('discountEuro').value.trim();
let percent=document.getElementById('discountPercent').value.trim();

euro=euro.replace(',','.');
percent=percent.replace(',','.');

if(euro!==''){

discountItem.discountType='EURO';
discountItem.discountValue=parseFloat(euro)||0;

}else if(percent!==''){

discountItem.discountType='PERCENT';
discountItem.discountValue=parseFloat(percent)||0;

}else{

discountItem.discountType=null;
discountItem.discountValue=0;

}

discountItem.isGift=false;

closeDiscount();

renderCart();

}

function clearDiscount(){

if(!discountItem)return;

discountItem.discountType=null;
discountItem.discountValue=0;

closeDiscount();

renderCart();

}function renderCart(){
let s=0;

document.getElementById('cart').innerHTML=cart.map(function(i){

var preis=getItemPrice(i);
s+=i.qty*preis;

var text=i.qty+'x '+i.name;

if(i.isGift){
text+=' 🎁 GESCHENK';
}

text+=' ('+euro(preis)+')';

if(i.discountValue>0){

if(i.discountType==='PERCENT'){

text+=' 💰 RABATT '+i.discountValue+'%';

}else{

text+=' 💰 RABATT '+euro(i.discountValue);

}

}

return '<div class="row"><span>'+text+'</span><span><button onclick="removeItem(\''+i.cartId+'\')">🗑️</button><button onclick="toggleGift(\''+i.cartId+'\')">🎁</button><button onclick="setDiscount(\''+i.cartId+'\')">💰</button></span></div>';

}).join('');

document.getElementById('total').textContent=euro(s);
}
function showCheckoutPreview(){

let html='';

let total=0;

cart.forEach(item=>{

let preis=getItemPrice(item);

total+=preis;

let text=item.name;

if(item.isGift){
text+=' 🎁';
}

if(item.discountType==='PERCENT'){
text+=' 💰 '+item.discountValue+'%';
}

if(item.discountType==='EURO'){
text+=' 💰 '+euro(item.discountValue);
}

html+='<div style="display:flex;justify-content:space-between;margin:4px 0;"><span>'+text+'</span><span>'+euro(preis)+'</span></div>';

});

html+='<hr>';
html+='<h3>Summe: '+euro(total)+'</h3>';

document.getElementById('checkoutContent').innerHTML=html;

document.getElementById('checkoutModal').classList.add('open');

}

function closeCheckoutPreview(){

document.getElementById('checkoutModal').classList.remove('open');

}

function checkout(){

if(!cart.length)return;

const total=cart.reduce((sum,item)=>{

const preis=getItemPrice(item);

return sum+(item.qty*preis);

},0);

if(editingSale!==null){

sales[editingSale]={
time:new Date().toLocaleTimeString('de-DE'),
salesLocation:activeSalesLocation,
total:total,
items:JSON.parse(JSON.stringify(cart))
};
editingSale=null;

document.getElementById('editInfo').style.display='none';

localStorage.setItem('sales_v31',JSON.stringify(sales));

closeCheckoutPreview();



cart=[];
expanded={};

render();

return;

}

sales.push({
time:new Date().toLocaleTimeString('de-DE'),
salesLocation:activeSalesLocation,
total:total,
items:JSON.parse(JSON.stringify(cart))
});



localStorage.setItem('sales_v31',JSON.stringify(sales));

closeCheckoutPreview();

cart=[];
expanded={};

render();

}
function stats(){

const filteredSales=sales.filter(
sale =>
!sale.storno &&
(
activeSalesLocation==='ALLE' ||
sale.salesLocation===activeSalesLocation
)
);

const u=filteredSales.reduce(
(a,b)=>a+b.total,
0
);

let artikelAnzahl=0;

filteredSales.forEach(sale=>{
if(sale.items){
sale.items.forEach(item=>{
artikelAnzahl+=item.qty;
});
}
});

umsatz.textContent=euro(u);

bons.textContent=filteredSales.length;

document.getElementById('artikel')
.textContent=artikelAnzahl;
}
function showSales(){

const filteredSales=sales.filter(
s =>
activeSalesLocation==='ALLE' ||
s.salesLocation===activeSalesLocation
);

const gesamt=filteredSales.reduce(
(a,b)=>a+b.total,
0
);

salesContent.innerHTML=
(
filteredSales.length
?
filteredSales.map((s,i)=>{

let artikel='';

if(s.items){

artikel=s.items.map(item=>{

let preis=getItemPrice(item);

let text=item.qty+'x '+item.name;

if(item.isGift){
text+=' 🎁 GESCHENK';
}

text+=' ('+euro(preis)+') = '+euro(item.qty*preis);

return text;

}).join('<br>');
}

return `
<div>
<strong>${i+1}. ${s.time}</strong>
<br>
🏪 ${s.salesLocation || 'Unbekannt'}
<br><br>

${artikel}

<br><br>

<button
style="background:red;color:white;border:none;padding:6px 10px;border-radius:6px;"
onclick="deleteSale(${sales.indexOf(s)})">
🗑️ Stornieren
</button>

</div>
<hr>
`;

}).join('')
:
'Keine Verkäufe vorhanden'
)

+

'<hr><h3>Gesamtumsatz: '+euro(gesamt)+'</h3>';

salesModal.classList.add('open');
}
let deleteIndex=null;

function showAllSales(){

const gesamt=sales
.filter(s=>!s.storno)
.reduce((a,b)=>a+b.total,0);

salesContent.innerHTML=
sales
.filter(s=>!s.storno)
.map((s,i)=>{

let artikel='';

if(s.items){
artikel=s.items.map(item=>{

let preis=getItemPrice(item);

return item.qty+
'x '+
item.name+
' ('+
euro(preis)+
')';

}).join('<br>');
}

return `
<div>
<strong>${i+1}. ${s.time}</strong>
<br>
🏪 ${s.salesLocation||'Unbekannt'}
<br><br>
${artikel}
<br><br>
${euro(s.total)}
</div>
<hr>
`;

}).join('')

+

'<h3>Gesamtumsatz: '+
euro(gesamt)+
'</h3>';

salesModal.classList.add('open');
}

function closeSales(){
salesModal.classList.remove('open');
}function deleteSale(index){deleteIndex=index;document.getElementById('confirmModal').classList.add('open');}function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');deleteIndex=null;}function confirmDelete(){if(deleteIndex===null)return;sales[deleteIndex].storno=true;localStorage.setItem('sales_v31',JSON.stringify(sales));document.getElementById('confirmModal').classList.remove('open');deleteIndex=null;stats();showSales();}function restoreSale(index){sales[index].storno=false;localStorage.setItem('sales_v31',JSON.stringify(sales));stats();showSales();}

function newProduct(){

salesContent.innerHTML='<h2>Neues Produkt</h2>Name:<br><input id="newName" style="width:100%;padding:8px;"><br><br>Kategorie:<br><select id="newCat" style="width:100%;padding:8px;"><option>Honige</option><option>Imkergut</option><option>Kerzen</option></select><br><br>Preis:<br><input id="newPrice" type="number" step="0.01" value="0" style="width:100%;padding:8px;"><br><br>Position:<br><input id="newPos" type="number" value="999" style="width:100%;padding:8px;"><br><br><label><input type="checkbox" id="newFav"> Favorit</label><br><br><button class="pay" onclick="saveNewProduct()">💾 Produkt speichern</button><br><br><button class="listbtn" onclick="showPortfolio()">Abbrechen</button>';

salesModal.classList.add('open');
}

function saveNewProduct(){

let maxId=0;

products.forEach(p=>{
if(p.id){
let nr=parseInt(p.id.replace('P',''));
if(nr>maxId)maxId=nr;
}
});

const neueId='P'+String(maxId+1).padStart(4,'0');

if(!document.getElementById('newName').value.trim()){
alert('Bitte Produktnamen eingeben');
return;
}

products.push({
id:neueId,
name:document.getElementById('newName').value.trim(),
cat:document.getElementById('newCat').value,
price:parseFloat(document.getElementById('newPrice').value)||0,
pos:parseInt(document.getElementById('newPos').value)||999,
fav:document.getElementById('newFav').checked
});

saveProducts();

render();
showPortfolio();
}

function showInventory(){

let inventory={};

const productCategories={};

products.forEach(p=>{
productCategories[p.name]=p.cat;
});
sales.filter(sale=>!sale.storno).forEach(sale=>{

if(sale.items){

sale.items.forEach(item=>{

if(!inventory[item.name]){
inventory[item.name]={
qty:0,
umsatz:0
};
}

inventory[item.name].qty+=item.qty;
inventory[item.name].umsatz+=item.qty*getItemPrice(item);

});

}

});

html+='<div style="max-height:500px;overflow-y:auto;">';

html+='</tr>';
html+='</thead>';

html+='<tbody>';

let gesamtUmsatz=0;

['Honige','Imkergut','Kerzen'].forEach(cat=>{

let katMenge=0;
let katUmsatz=0;

html+='<tr style="background:#f3f4f6;">';
html+='<td colspan="3" style="padding:10px;font-weight:bold;font-size:16px;">'+cat+'</td>';
html+='</tr>';

Object.keys(inventory)
.filter(name=>productCategories[name]===cat)
.sort((a,b)=>inventory[b].umsatz-inventory[a].umsatz)
.forEach(name=>{

katMenge+=inventory[name].qty;
katUmsatz+=inventory[name].umsatz;

html+='<tr>';

gesamtMenge+=katMenge;
gesamtUmsatz+=katUmsatz;

html+='<tr style="background:#ecfccb;font-weight:bold;">';

});

html+='<tr style="background:#bfdbfe;font-weight:bold;font-size:16px;">';

html+='</tr>';

html+='</tbody>';
html+='</table>';
html+='</div>';

salesContent.innerHTML=html;
salesModal.classList.add('open');
}
